@if (store.battleOutcome() !== 'ongoing') {
  <div
    class="battle-outcome"
    [class.battle-outcome--victory]="store.battleOutcome() === 'victory'"
    [class.battle-outcome--defeat]="store.battleOutcome() === 'defeat'"
  >
    <h1>{{ outcomeTitle() }}</h1>
  </div>
} @else if (store.battle(); as battle) {
  <div class="battle-screen">
    <aside class="zone deck" style="grid-area: deck">
      <h2 class="zone-title">Talia</h2>
      <app-deck-panel [entries]="store.deckView()" />
    </aside>

    <section class="zone board" style="grid-area: board">
      <app-battlefield
        [enemies]="battle.enemies"
        [player]="battle.player"
        [targetableIds]="store.targetableIds()"
        [phase]="battle.phase"
        [staged]="battle.staged"
        [deckPreviewEnabled]="store.enemyDeckVisible()"
        (targetPicked)="onTargetPicked($event)"
      />
    </section>

    <aside class="zone log" style="grid-area: log">
      <h2 class="zone-title">Log walki</h2>
      <app-battle-log [entries]="store.log()" />
    </aside>

    <footer class="zone hand" style="grid-area: hand">
      <app-hand-bar
        [hand]="store.hand()"
        [selection]="battle.selection"
        [canConfirm]="store.canConfirm()"
        [maxSelectable]="store.dicePerTurn"
        (toggled)="onDieToggled($event)"
        (confirmed)="onConfirmed()"
      />
    </footer>
  </div>
}
