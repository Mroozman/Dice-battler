<div class="battlefield">
  <app-turn-banner [message]="turnMessage()" />

  <div class="enemy-row" [class.enemy-row--boss]="isBoss()">
    @for (enemy of enemies(); track enemy.id; let i = $index) {
      <div class="enemy-slot">
        @if (!isBoss()) {
          <span class="enemy-number">{{ i + 1 }}</span>
        }
        <app-combatant-card
          [combatant]="enemy"
          [state]="enemyState(enemy)"
          [showDeckPreview]="deckPreviewEnabled()"
          [boss]="isBoss()"
          [targeted]="enemy.hp > 0 && pickedTargetIds().includes(enemy.id)"
          (picked)="onEnemyPicked(enemy.id)"
        />
      </div>
    }
  </div>

  <div class="dice-stage-row">
    <app-die-stage [staged]="staged()" />
    <app-bonus-die [bonus]="stagedBonus()" [kind]="stagedKind()" [revealed]="stagedRevealed()" />
  </div>

  <app-combatant-card [combatant]="player()" />
</div>
